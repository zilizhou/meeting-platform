services:
  mysql:
    image: mysql:8.0
    container_name: qfnu-meeting-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: qfnu_meeting
      MYSQL_USER: meeting
      MYSQL_PASSWORD: meeting123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umeeting", "-pmeeting123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
